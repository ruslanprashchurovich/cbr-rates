name: Fetch CBR rates

on:
  # Расписание выключено. Чтобы снова включить, раскомментируйте две строки:
  # schedule:
  #   - cron: "23 14 * * *"   # раз в день, 14:23 UTC = 17:23 МСК (cron всегда в UTC)
  workflow_dispatch: {} # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write # разрешаем workflow коммитить в репозиторий

concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Берём актуальную вершину main на момент выполнения, а не SHA,
          # зафиксированный при создании запуска (важно для re-run старых запусков).
          ref: main

      - name: Fetch rates
        run: python3 fetch_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.csv
          if git diff --cached --quiet; then
            echo "Курс не изменился — коммитить нечего."
            exit 0
          fi
          git commit -m "rates: $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Если main успел уехать вперёд, подтягиваем изменения и пробуем ещё раз
          git push || (git pull --rebase origin main && git push)
