name: Fetch CBR rates

on:
  schedule:
    # ВНИМАНИЕ: время в cron указывается в UTC (МСК = UTC+3).
    # Сейчас — каждые 10 минут (для примера). Минуты сдвинуты с «круглых»
    # (:00, :10, ...), потому что в них очередь на раннеры длиннее всего.
    # Для запуска раз в день замените строку ниже, например, на:
    #   - cron: "23 14 * * *"   # ~17:23 МСК, курс на завтра уже опубликован
    - cron: "3-59/10 * * * *"
  workflow_dispatch: {} # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write # разрешаем workflow коммитить в репозиторий

concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch rates
        run: python3 fetch_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.csv
          if git diff --cached --quiet; then
            echo "Курс не изменился — коммитить нечего."
            exit 0
          fi
          git commit -m "rates: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
