name: Fetch MOEX CNY rate

on:
  # Расписание выключено. Чтобы снова включить, раскомментируйте две строки:
  # schedule:
  #   - cron: "4-59/10 * * * *"   # каждые 10 минут (cron всегда в UTC)
  workflow_dispatch: {} # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write

# Общая группа с workflow курсов ЦБ: оба коммитят в main,
# поэтому выполняем их строго по очереди, чтобы не гонялись за push.
concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch CNY rate
        run: python3 fetch_moex_cny.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cny_rub.csv
          if git diff --cached --quiet; then
            echo "Курс не изменился — коммитить нечего."
            exit 0
          fi
          git commit -m "cny: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push || (git pull --rebase origin main && git push)
